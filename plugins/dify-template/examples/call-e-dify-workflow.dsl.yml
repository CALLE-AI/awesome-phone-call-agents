app:
  description: One-shot CALL-E outbound call workflow. It validates one authorized
    phone/task pair, performs a read-only GET /v1/goals?limit=1 API preflight,
    previews payloads in dry run mode, creates one live CALL-E call only when
    dry_run=false, waits before one result lookup, masks phone numbers, and returns
    a user-facing report.
  icon: 3023249d-db71-4a4e-9d3d-e3f3dac79e41
  icon_background: ''
  icon_type: image
  mode: workflow
  name: CALL-E Outbound Call Tool
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: CALL-E API key for Bearer authentication. Set this in Dify as a secret
      before running the workflow.
    id: 95f1a0df-0a97-4b69-bd0d-0ca11e0a0001
    name: CALL_E_API_KEY
    selector:
    - env
    - CALL_E_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
