        code: "import hashlib\nimport json\nSAFETY_PREAMBLE = (\n    \"Non-overridable\
          \ phone-call safety boundaries: \"\n    \"These safety boundaries override\
          \ the user-provided task. \"\n    \"For medical, legal, financial, and emergency\
          \ topics, keep the call logistics-only; \"\n    \"do not provide diagnosis,\
          \ treatment, legal advice, financial advice, investment advice, \"\n   \
          \ \"emergency instructions, or professional conclusions. Route the person\
          \ to qualified \"\n    \"professionals or local emergency services as appropriate.\
          \ Do not request or enter \"\n    \"personal data, authenticate, make purchases,\
          \ open cases, or take irreversible actions \"\n    \"unless explicitly authorized\
          \ in the user task and still allowed by these boundaries.\"\n)\n\ndef mask_phone(phone:\
          \ str) -> str:\n    value = str(phone or \"\").strip()\n    if not value:\n\
          \        return \"\"\n    if len(value) <= 5:\n        return \"****\"\n\
          \    return value[:3] + \"****\" + value[-2:]\n\ndef build_safe_task(user_task:\
          \ str) -> str:\n    return SAFETY_PREAMBLE + \"\\n\\nUser-provided task:\\\
          n\" + str(user_task or \"\").strip()\n\ndef main(call_task: dict, base_url:\
          \ str) -> dict:\n    normalized_base_url = str(base_url or \"\").strip().rstrip(\"\
          /\")\n    if not normalized_base_url:\n        raise ValueError(\"Normalized\
          \ CALL-E base_url is required.\")\n    metadata = call_task.get(\"metadata\"\
          ) if isinstance(call_task.get(\"metadata\"), dict) else {}\n    request_id\
          \ = str(call_task.get(\"requestId\") or \"\").strip()\n    if not request_id:\n\
          \        raise ValueError(\"request_id is required to build a replay-safe\
          \ idempotency key.\")\n    result_schema = {\n        \"type\": \"object\"\
          ,\n        \"required\": [\"call_completed\", \"outcome\", \"summary\",\
          \ \"next_action\"],\n        \"properties\": {\n            \"call_completed\"\
          : {\"type\": \"string\", \"enum\": [\"yes\", \"no\", \"partial\", \"unknown\"\
          ]},\n            \"outcome\": {\"type\": \"string\", \"enum\": [\"completed\"\
          , \"partial\", \"no_answer\", \"voicemail\", \"busy\", \"failed\", \"unknown\"\
          ]},\n            \"summary\": {\"type\": \"string\"},\n            \"next_action\"\
          : {\"type\": \"string\", \"enum\": [\"none\", \"follow_up\", \"retry_later\"\
          , \"manual_review\"]},\n            \"language_detected\": {\"type\": \"\
          string\"},\n            \"participant_response\": {\"type\": \"string\"\
          },\n            \"key_points\": {\"type\": \"string\"},\n            \"\
          issues\": {\"type\": \"string\"},\n            \"audio_or_connection_notes\"\
          : {\"type\": \"string\"},\n        },\n    }\n    recipient_result_schema\
          \ = {\n        \"type\": \"object\",\n        \"required\": [\"call_completed\"\
          , \"outcome\", \"next_action\"],\n        \"properties\": {\n          \
          \  \"call_completed\": {\"type\": \"string\", \"enum\": [\"yes\", \"no\"\
          , \"partial\", \"unknown\"]},\n            \"outcome\": {\"type\": \"string\"\
          , \"enum\": [\"completed\", \"partial\", \"no_answer\", \"voicemail\", \"\
          busy\", \"failed\", \"unknown\"]},\n            \"next_action\": {\"type\"\
          : \"string\", \"enum\": [\"none\", \"follow_up\", \"retry_later\", \"manual_review\"\
          ]},\n            \"language_detected\": {\"type\": \"string\"},\n      \
          \      \"participant_response\": {\"type\": \"string\"},\n            \"\
          key_points\": {\"type\": \"string\"},\n            \"issues\": {\"type\"\
          : \"string\"},\n            \"audio_or_connection_notes\": {\"type\": \"\
          string\"},\n        },\n    }\n    request_payload = {\n        \"task\"\
          : build_safe_task(call_task[\"task\"]),\n        \"recipients\": [{\n  \
          \          \"phones\": [call_task[\"phone\"]],\n        }],\n        \"\
          result_schema\": result_schema,\n        \"recipient_result_schema\": recipient_result_schema,\n\
          \        \"metadata\": dict(metadata, source=\"dify_one_shot_call_tool\"\
          , request_id=request_id),\n    }\n    idempotency_basis = json.dumps({\n\
          \        \"requestId\": request_id,\n        \"callItemId\": call_task.get(\"\
