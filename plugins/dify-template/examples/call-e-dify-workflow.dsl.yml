          \ str, validation_error: str, base_url: str) -> dict:\n    contexts = call_contexts\
          \ if isinstance(call_contexts, list) else []\n    context = contexts[0]\
          \ if contexts and isinstance(contexts[0], dict) else {}\n    has_live_call\
          \ = bool(context.get(\"callId\"))\n    now_ms = int(time.time() * 1000)\n\
          \    done = not has_live_call or bool(context.get(\"initialDone\"))\n  \
          \  initial_json = context.get(\"initialCallJson\") or '{\"status\":\"completed\"\
          ,\"_dify_no_live_call\":true}'\n    base_url = str(base_url or \"https://api.heycall-e.com\"\
          ).strip().rstrip(\"/\")\n    return {\n        \"has_live_call\": has_live_call,\n\
          \        \"call_context\": context,\n        \"call_id\": context.get(\"\
          callId\", \"\"),\n        \"lookup_url\": context.get(\"lookupUrl\", \"\"\
          ) if has_live_call else f\"{base_url}/v1/goals?limit=1\",\n        \"initial_call_json\"\
          : initial_json,\n        \"started_at_ms\": int(context.get(\"startedAtMs\"\
          ) or now_ms),\n        \"initial_done\": done,\n        \"metadata_sent_json\"\
          : str(context.get(\"metadataSentJson\") or \"{}\"),\n        \"validation_error\"\
