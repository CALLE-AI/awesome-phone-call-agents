    nodes:
    - data:
        desc: Set the CALL_E_API_KEY secret environment variable, then fill one phone_number
          and one task. Keep dry_run=true to preview and check API connectivity only.
          Switch dry_run=false only when you want one live call.
        selected: false
        title: Start
        type: start
        variables:
        - default: https://api.heycall-e.com
          label: CALL-E API base URL (host only; no /v1)
          required: true
          type: text-input
          variable: base_url
        - default: 'true'
          label: Dry run? true checks connectivity only
          options:
          - 'true'
          - 'false'
          required: true
          type: select
          variable: dry_run
        - default: ''
          label: Replay-safe request ID
          required: true
          type: text-input
          variable: request_id
        - default: ''
          label: Phone number to call (E.164)
          required: true
          type: text-input
          variable: phone_number
        - default: Call this owned or explicitly authorized number. Follow the user's
            task exactly. Do not request or enter personal data, authenticate, make
            purchases, open cases, or take irreversible actions unless the user has
            explicitly authorized that behavior in this task. Keep the call concise
            and summarize the outcome, key points, issues, and recommended next action.
          label: CALL-E task
          max_length: 4000
          required: true
          type: paragraph
          variable: task
