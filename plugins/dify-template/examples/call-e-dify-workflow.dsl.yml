        code: "import json\nimport re\nimport time\nfrom urllib.parse import urlparse\n\
          \nTERMINAL_STATUSES = {\n    \"completed\", \"failed\", \"canceled\", \"\
          cancelled\",\n    \"no_answer\", \"declined\", \"voicemail\", \"busy\",\
          \ \"expired\"\n}\n\nTRUSTED_BASE_URLS = {\n    \"https://api.heycall-e.com\"\
          ,\n    # Add CALL-E-managed test hosts here before running non-production\
          \ workflows.\n}\nPLACEHOLDER_PHONES = {\"+15555550101\", \"+15555550102\"\
          , \"+15555550123\", \"+14155550123\"}\nE164_RE = re.compile(r\"^\\+[1-9]\\\
          d{6,14}$\")\nREQUEST_ID_RE = re.compile(r\"^[A-Za-z0-9._:-]{8,120}$\")\n\
          PHONE_IN_TEXT_RE = re.compile(r\"\\+[1-9]\\d{6,14}\")\nINTERNATIONAL_GROUPED_PHONE_RE\
          \ = re.compile(r\"(?<!\\w)\\+[1-9](?:[\\s().-]*\\d){6,14}(?![\\s().-]*\\\
          d)\")\nPHONE_LIKE_RE = re.compile(r\"(?<!\\d)(?:\\+?1[\\s.-]?)?(?:\\(?[2-9]\\\
          d{2}\\)?[\\s.-]?[2-9]\\d{2}[\\s.-]?\\d{4}|[1-9]\\d{6,14})(?!\\d)\")\n\n\
          def normalize_trusted_base_url(value) -> str:\n    raw = str(value or \"\
          https://api.heycall-e.com\").strip().rstrip(\"/\")\n    if raw.endswith(\"\
          /v1\"):\n        raw = raw[:-3].rstrip(\"/\")\n    parsed = urlparse(raw)\n\
          \    if parsed.scheme.lower() != \"https\":\n        raise ValueError(\"\
          CALL-E base_url must use https.\")\n    if parsed.params or parsed.query\
          \ or parsed.fragment:\n        raise ValueError(\"CALL-E base_url must not\
          \ include parameters, query strings, or fragments.\")\n    if parsed.path\
          \ not in {\"\", \"/\"}:\n        raise ValueError(\"CALL-E base_url must\
          \ be a host URL only; do not include a path except /v1.\")\n    normalized\
          \ = f\"https://{parsed.netloc.lower()}\".rstrip(\"/\")\n    if normalized\
          \ not in TRUSTED_BASE_URLS:\n        raise ValueError(\"CALL-E base_url\
          \ must be a trusted CALL-E API host. Use https://api.heycall-e.com or add\
          \ a CALL-E-managed test host to the workflow allowlist.\")\n    return normalized\n\
          \ndef mask_phone(phone: str) -> str:\n    value = str(phone or \"\").strip()\n\
          \    if not value:\n        return \"\"\n    if len(value) <= 5:\n     \
          \   return \"****\"\n    return value[:3] + \"****\" + value[-2:]\n\ndef\
          \ mask_phone_like(value: str) -> str:\n    raw = str(value or \"\").strip()\n\
          \    digits = re.sub(r\"\\D\", \"\", raw)\n    if not digits:\n        return\
          \ \"\"\n    if len(digits) <= 5:\n        return \"****\"\n    if raw.startswith(\"\
          +\"):\n        return \"+\" + digits[:2] + \"****\" + digits[-2:]\n    return\
          \ digits[:3] + \"****\" + digits[-2:]\n\ndef redact_phone_text(value: str)\
          \ -> str:\n    text = INTERNATIONAL_GROUPED_PHONE_RE.sub(lambda match: mask_phone_like(match.group(0)),\
          \ str(value or \"\"))\n    text = PHONE_IN_TEXT_RE.sub(lambda match: mask_phone_like(match.group(0)),\
          \ text)\n    return PHONE_LIKE_RE.sub(lambda match: mask_phone_like(match.group(0)),\
          \ text)\n\ndef redact_phone_values(value):\n    if isinstance(value, str):\n\
          \        return redact_phone_text(value)\n    if isinstance(value, list):\n\
          \        return [redact_phone_values(v) for v in value]\n    if isinstance(value,\
          \ dict):\n        return {redact_phone_text(k) if isinstance(k, str) else\
          \ k: redact_phone_values(v) for k, v in value.items()}\n    return value\n\
          \ndef parse_dry_run(value) -> bool:\n    normalized = str(value or \"\"\
          ).strip()\n    if normalized == \"true\":\n        return True\n    if normalized\
          \ == \"false\":\n        return False\n    raise ValueError(\"dry_run must\
          \ be either true or false. Use false only when you intend to create one\
          \ live outbound call.\")\n\ndef validation_response(base_url: str, dry_run_enabled:\
          \ bool, message: str) -> dict:\n    poll_interval_seconds = 20\n    wait_timeout_minutes\
          \ = 15\n    return {\n        \"base_url\": base_url,\n        \"dry_run\"\
          : \"true\" if dry_run_enabled else \"false\",\n        \"poll_interval_seconds\"\
          : poll_interval_seconds,\n        \"wait_timeout_minutes\": wait_timeout_minutes,\n\
          \        \"max_poll_count\": int((wait_timeout_minutes * 60) / poll_interval_seconds),\n\
          \        \"call_tasks\": [],\n        \"preview_tasks\": [],\n        \"\
          task_count\": 0,\n        \"live_task_count\": 0,\n        \"validation_error\"\
          : message,\n        \"preview_json\": json.dumps({\n            \"dryRun\"\
          : dry_run_enabled,\n            \"willCreateLiveCalls\": False,\n      \
          \      \"connectivityCheck\": f\"{base_url}/v1/goals?limit=1\",\n      \
          \      \"liveCreateEndpoint\": f\"{base_url}/v1/calls\",\n            \"\
          liveResultLookup\": {\n                \"endpoint\": f\"{base_url}/v1/calls/{{id}}\"\
          ,\n                \"pollIntervalSeconds\": poll_interval_seconds,\n   \
          \             \"timeoutMinutes\": wait_timeout_minutes,\n            },\n\
          \            \"tasks\": [],\n            \"validationError\": message,\n\
          \        }, ensure_ascii=False, indent=2),\n    }\n\ndef main(base_url:\
          \ str, dry_run: str, request_id: str, phone_number: str, task: str) -> dict:\n\
          \    base_url = normalize_trusted_base_url(base_url)\n    dry_run_enabled\
          \ = parse_dry_run(dry_run)\n    request_id = str(request_id or \"\").strip()\n\
          \    default_phone = str(phone_number or \"\").strip()\n    default_task\
          \ = str(task or \"\").strip()\n    poll_interval_seconds = 20\n    wait_timeout_minutes\
          \ = 15\n\n    if not request_id:\n        return validation_response(base_url,\
          \ dry_run_enabled, \"Fill request_id with a stable unique value for this\
          \ intended call. Reuse it only when replaying the same call after an ambiguous\
          \ create result.\")\n    if not REQUEST_ID_RE.match(request_id):\n     \
          \   return validation_response(base_url, dry_run_enabled, \"request_id must\
          \ be 8-120 characters using letters, numbers, dot, underscore, colon, or\
          \ hyphen.\")\n    if not default_phone or not default_task:\n        return\
          \ validation_response(base_url, dry_run_enabled, \"Fill both phone_number\
          \ and task for this one-shot call.\")\n    if default_phone and not E164_RE.match(default_phone):\n\
          \        raise ValueError(\"phone_number must be in E.164 format, for example\
          \ +15555550123.\")\n    if not dry_run_enabled and default_phone in PLACEHOLDER_PHONES:\n\
          \        raise ValueError(\"Replace the placeholder phone_number with a\
          \ number you own or are explicitly authorized to call before running live\
          \ calls.\")\n\n    call_tasks = [{\n        \"callItemId\": \"call_001\"\
          ,\n        \"requestId\": request_id,\n        \"callName\": \"One-shot\
          \ outbound call\",\n        \"phone\": default_phone,\n        \"task\"\
          : default_task,\n        \"metadata\": {},\n    }]\n\n    normalized = []\n\
          \    for index, task in enumerate(call_tasks):\n        if not isinstance(task,\
          \ dict):\n            raise ValueError(f\"Call task at index {index} must\
          \ be an object.\")\n        phone = default_phone\n        call_item_id\
          \ = str(task.get(\"callItemId\") or f\"call_{index + 1}\")\n        if not\
          \ E164_RE.match(phone):\n            raise ValueError(f\"Fill phone_number\
          \ for {call_item_id} using E.164 format, for example +15555550123.\")\n\
          \        if not dry_run_enabled and phone in PLACEHOLDER_PHONES:\n     \
          \       raise ValueError(f\"Replace the placeholder phone number for {call_item_id}\
          \ with a number you own or are explicitly authorized to call before running\
          \ live calls.\")\n        task_text = default_task\n        if not task_text:\n\
          \            raise ValueError(f\"Fill task for {call_item_id}.\")\n    \
          \    normalized.append({\n            \"callItemId\": call_item_id,\n  \
          \          \"requestId\": str(task.get(\"requestId\") or request_id),\n\
          \            \"callName\": task.get(\"callName\") or task.get(\"ivrName\"\
          ) or call_item_id,\n            \"phone\": phone,\n            \"task\"\
          : task_text,\n            \"metadata\": task.get(\"metadata\") if isinstance(task.get(\"\
          metadata\"), dict) else {},\n        })\n\n    preview = [{\n        \"\
          callItemId\": item[\"callItemId\"],\n        \"callName\": item[\"callName\"\
          ],\n        \"requestId\": item[\"requestId\"],\n        \"maskedPhone\"\
          : mask_phone(item[\"phone\"]),\n        \"task\": redact_phone_text(item[\"\
          task\"]),\n        \"metadata\": redact_phone_values(item[\"metadata\"]),\n\
          \    } for item in normalized]\n\n    return {\n        \"base_url\": base_url,\n\
          \        \"dry_run\": \"true\" if dry_run_enabled else \"false\",\n    \
          \    \"poll_interval_seconds\": poll_interval_seconds,\n        \"wait_timeout_minutes\"\
          : wait_timeout_minutes,\n        \"max_poll_count\": int((wait_timeout_minutes\
