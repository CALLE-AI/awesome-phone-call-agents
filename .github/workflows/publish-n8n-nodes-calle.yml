name: Publish n8n-nodes-calle

on:
  push:
    tags:
      - 'n8n-nodes-calle-v*.*.*'

jobs:
  publish:
    name: Publish n8n-nodes-calle to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: plugins/n8n-nodes-calle

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: plugins/n8n-nodes-calle/package-lock.json

      - name: Validate tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#n8n-nodes-calle-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Publish package
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
