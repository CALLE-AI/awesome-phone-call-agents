name: n8n-nodes-calle CI

on:
  pull_request:
    paths:
      - '.github/workflows/n8n-nodes-calle-ci.yml'
      - 'plugins/n8n-nodes-calle/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/n8n-nodes-calle-ci.yml'
      - 'plugins/n8n-nodes-calle/**'

concurrency:
  group: n8n-nodes-calle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/n8n-nodes-calle

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: plugins/n8n-nodes-calle/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run
