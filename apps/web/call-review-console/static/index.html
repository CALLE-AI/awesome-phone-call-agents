<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call Review Console</title>
<style>
:root{--bg:#f6f5f1;--ink:#151515;--mut:#6b6b6b;--line:#ddd;--ok:#0a7a3d;--bad:#b3261e;--warn:#9a6a00;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}h1{margin:0;font-size:24px}.sub{color:var(--mut);margin:2px 0 0}
main{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 76px)}aside{border-right:1px solid var(--line);padding:14px;overflow:auto}section{padding:18px 24px;overflow:auto}
.call{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;cursor:pointer}.call:hover{border-color:#999}.call.sel{border-color:var(--ink)}.call .t{font-size:13px;color:#333;margin-top:2px}
.v{display:inline-block;font-weight:600;padding:1px 8px;border-radius:6px;border:1px solid;font-size:12px}.v-approve{color:var(--ok);border-color:#b7dcc6;background:#f1faf4}.v-needs_human{color:var(--warn);border-color:#e6d3a3;background:#fff9e8}.v-reject{color:var(--bad);border-color:#e8b4b0;background:#fff3f2}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}.kpi .val{font-size:20px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{background:#f2f2f2}
.turn{display:grid;grid-template-columns:64px 80px 1fr;gap:8px;padding:4px 0;border-bottom:1px dashed #eee;font-size:13px}.turn .o{color:var(--mut);font-family:ui-monospace,monospace}.turn.agent .s{color:#1b4fa0;font-weight:600}.turn .lat{color:var(--mut);font-size:11px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--mut)}.mono{font-family:ui-monospace,monospace;font-size:12px}
.note textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}.note button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;margin-right:6px}
</style></head><body>
<header><div><h1>Call Review Console</h1><p class="sub">Review a CALL-E call before you act on it. Read-only: this console never places a call. Numbers are masked.</p></div><div class="muted" id="health"></div></header>
<main><aside id="list"><p class="muted">loading…</p></aside><section id="detail"><p class="muted">Pick a call.</p></section></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){const h=await (await fetch('/api/health')).json();$('#health').textContent=`${h.calls_on_file} calls on file · live fetch ${h.live_fetch_enabled?'enabled':'off'} · LLM evidence ${h.llm?'on':'off'}`;
 const rows=await (await fetch('/api/calls')).json();
 $('#list').innerHTML=`<div class="call" onclick="bench()"><b>Benchmark</b><div class="t muted">every call on file: completion, evidence, latency</div></div>`+rows.map(r=>`<div class="call" onclick="open('${esc(r.id)}',this)"><span class="v v-${esc(r.verdict)}">${esc(r.verdict.replace('_',' '))}</span> <span class="mono">${esc(r.id)}</span> <span class="muted" style="font-size:11px">${esc(r.source)}${r.reviewed?' · reviewed':''}</span><div class="t">${esc(r.task).slice(0,90)}</div><div class="muted" style="font-size:12px">${r.status} · p50 ${r.p50??'—'}s · ${r.unsupported} unsupported</div></div>`).join('');
 if(rows.length) open(rows[0].id, document.querySelectorAll('.call')[1]);}
async function open(id,el){document.querySelectorAll('.call').forEach(x=>x.classList.remove('sel'));if(el)el.classList.add('sel');
 const d=await (await fetch(`/api/calls/${id}`)).json();const t=d.task,r=d.review,tm=r.timing,c=r.compliance;
 const turns=(t.recipients||[]).flatMap(x=>(x.attempts||[]).flatMap(a=>a.transcript_turns||[]));
 let prevCallee=null;const turnHtml=turns.map(u=>{const ag=['agent','assistant','ai','calle','bot'].includes(String(u.speaker).toLowerCase());let lat='';if(ag&&prevCallee!==null){lat=`+${(u.offset_seconds-prevCallee).toFixed(1)}s`;}if(!ag)prevCallee=u.offset_seconds;return `<div class="turn ${ag?'agent':''}"><span class="o">${Number(u.offset_seconds).toFixed(1)}s</span><span class="s">${esc(u.speaker)} <span class="lat">${lat}</span></span><span>${esc(u.text)}</span></div>`}).join('');
 $('#detail').innerHTML=`<div class="kpis"><div class="kpi"><div class="k">verdict</div><div class="val"><span class="v v-${esc(r.verdict)}">${esc(r.verdict.replace('_',' '))}</span></div></div><div class="kpi"><div class="k">status</div><div class="val">${esc(t.status)}</div></div><div class="kpi"><div class="k">task completed</div><div class="val">${t.task_completed===null?'—':t.task_completed}</div></div><div class="kpi"><div class="k">confidence</div><div class="val">${r.completion_confidence??'—'}</div></div><div class="kpi"><div class="k">response p50 / p95</div><div class="val">${tm.response_p50_s??'—'} / ${tm.response_p95_s??'—'}s</div></div><div class="kpi"><div class="k">unsupported fields</div><div class="val ${r.unsupported_count?'bad':''}">${r.unsupported_count}</div></div></div>
 <div class="card"><h2>Why</h2>${r.reasons.length?'<ul>'+r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="muted">No issues found by the deterministic checks.</p>'}<p class="muted mono">task: ${esc(t.task)}</p><p class="muted">summary: ${esc(t.summary||'—')}</p></div>
 <div class="card"><h2>Structured result vs. transcript</h2><table><tr><th>field</th><th>value</th><th>supported</th><th>how</th></tr>${r.evidence.map(e=>`<tr><td class="mono">${esc(e.field)}</td><td>${esc(JSON.stringify(e.value))}</td><td class="${e.supported===true?'ok':e.supported===false?'bad':'muted'}">${e.supported===null?'unknown':e.supported?'yes':'NO'}</td><td class="muted">${esc(e.how)}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>no structured result</td></tr>'}</table>${r.llm_used?'':'<p class="muted" style="margin:6px 0 0">Deterministic matching only. <a href="#" onclick="event.preventDefault();openLLM(\''+esc(t.id)+'\')">Re-check with the model</a> (needs a Google key).</p>'}</div>
 <div class="card"><h2>Compliance</h2><table><tr><th>AI disclosed</th><td class="${c.ai_disclosed?'ok':'bad'}">${c.ai_disclosed?'yes':'no'}${c.ai_disclosed_first_turn?' (first turn)':''}</td><th>stop requested</th><td>${c.stop_requested?'yes':'no'}</td><th>stop honored</th><td class="${c.stop_honored===false?'bad':c.stop_honored?'ok':'muted'}">${c.stop_honored===null?'—':c.stop_honored?'yes':'NO'}</td><th>sensitive readback</th><td class="${c.sensitive_readback?'bad':'ok'}">${c.sensitive_readback?'yes':'no'}</td></tr></table>
 <h3>Timing (from transcript offsets)</h3><table><tr><th>agent turns</th><td>${tm.agent_turns}</td><th>callee turns</th><td>${tm.callee_turns}</td><th>silences &gt; 4s</th><td>${tm.silences_over_threshold} (longest ${tm.longest_silence_s}s)</td><th>overlaps</th><td>${tm.overlaps}</td><th>duration</th><td>${tm.duration_seconds}s</td></tr></table></div>
 <div class="card"><h2>Transcript</h2>${turnHtml||'<p class="muted">no transcript</p>'}</div>
 <div class="card note"><h2>Human disposition</h2>${d.note?`<p>${esc(d.note.verdict)} by ${esc(d.note.reviewer)} at ${esc(d.note.reviewed_at)} — ${esc(d.note.note)}</p>`:''}<textarea id="ntext" rows="2" placeholder="note for the record"></textarea><div style="margin-top:6px"><button onclick="note('${esc(t.id)}','approve')">Approve</button><button onclick="note('${esc(t.id)}','needs_human')">Needs follow-up</button><button onclick="note('${esc(t.id)}','reject')">Reject</button></div></div>`;}
async function openLLM(id){const d=await (await fetch(`/api/calls/${id}?llm=true`)).json();alert(d.review.llm_used?'Model evidence check applied — reopen the call.':'No Google key configured; deterministic result kept.');}
async function note(id,v){const n=$('#ntext').value;await fetch(`/api/calls/${id}/note`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({verdict:v,note:n})});open(id);}
async function bench(){const b=await (await fetch('/api/benchmark')).json();const a=b.aggregate;
 $('#detail').innerHTML=`<div class="kpis"><div class="kpi"><div class="k">calls</div><div class="val">${a.calls}</div></div><div class="kpi"><div class="k">completed</div><div class="val">${a.completed}</div></div><div class="kpi"><div class="k">task completed</div><div class="val">${a.task_completed}</div></div><div class="kpi"><div class="k">approve / human / reject</div><div class="val">${a.approve} / ${a.needs_human} / ${a.reject}</div></div><div class="kpi"><div class="k">median p50 latency</div><div class="val">${a.median_p50_s??'—'}s</div></div><div class="kpi"><div class="k">unsupported claims</div><div class="val">${a.unsupported_claims}</div></div></div>
 <p class="muted">Sources on file: ${a.sources.join(', ')}. Fixture calls are fictional and labelled; ingest real terminal snapshots via the webhook or an opt-in fetch to benchmark your own calls.</p>
 <table><tr><th>call</th><th>source</th><th>status</th><th>task completed</th><th>p50</th><th>p95</th><th>silences</th><th>overlaps</th><th>unsupported</th><th>AI disclosed</th><th>verdict</th></tr>${b.rows.map(r=>`<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.source)}</td><td>${esc(r.status)}</td><td>${r.task_completed}</td><td>${r.p50??'—'}</td><td>${r.p95??'—'}</td><td>${r.silences}</td><td>${r.overlaps}</td><td class="${r.unsupported?'bad':''}">${r.unsupported}</td><td>${r.ai_disclosed?'yes':'no'}</td><td><span class="v v-${esc(r.verdict)}">${esc(r.verdict.replace('_',' '))}</span></td></tr>`).join('')}</table>`;}
load();
</script></body></html>
