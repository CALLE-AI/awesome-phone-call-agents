[project]
name = "call-review-console"
version = "0.1.0"
description = "Review a CALL-E call before you act on it: schema validity, transcript evidence for every structured field, turn latency, silences, overlaps, disclosure and stop-request compliance. Read-only; never places a call."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jsonschema>=4.22", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
live = ["calle-ai>=0.7.0"]
llm = ["google-genai>=1.30"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
