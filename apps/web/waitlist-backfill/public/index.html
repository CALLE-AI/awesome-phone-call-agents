<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waitlist Backfill</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #16191d; --muted: #667085; --line: #e3e6ea;
    --ok: #17803d; --warn: #b45309; --stop: #b42318; --live: #1d4ed8; --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a21; --ink: #e8eaed; --muted: #98a2b3; --line: #262c36;
      --ok: #4ade80; --warn: #fbbf24; --stop: #f87171; --live: #7aa2ff; --accent: #6f9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .slot { display: flex; flex-wrap: wrap; gap: 20px; align-items: baseline; }
  .slot b { font-size: 17px; }
  .slot span { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--stop); color: var(--stop); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .note { color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; }
  td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  tr.pending { opacity: .55; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .p-ok { color: var(--ok); } .p-skip { color: var(--warn); } .p-stop { color: var(--stop); }
  .p-live { color: var(--live); } .p-mute { color: var(--muted); }
  .reason { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  #log { max-height: 320px; overflow-y: auto; }
  #log div { padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  #log div:first-child { border-top: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 28px; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .banner { border-left: 3px solid var(--accent); padding-left: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Waitlist Backfill</h1>
  <div class="sub">A slot just opened. Ring the waiting list one at a time, stop at the first yes, and never call anyone behind them.</div>

  <div class="panel slot" id="slot"></div>

  <div class="panel">
    <div class="controls">
      <button class="primary" id="preview">Preview run</button>
      <input id="confirm" class="mono" placeholder="type the slot id to enable live calling"
             style="flex:1;min-width:260px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <button id="live" title="Requires a CALL-E API key and the slot id typed above" disabled>Run live</button>
      <button class="danger" id="cancel" disabled>Cancel</button>
    </div>
    <div class="note" id="modeNote" style="margin-top:10px"></div>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th style="width:34px">#</th><th>Contact</th><th style="width:120px">Number</th><th style="width:150px">Timezone</th><th>Decision</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="sub" style="margin:0 0 8px">Decision log</div>
    <div id="log"><div class="note">Nothing yet. Start a preview run.</div></div>
  </div>

  <div class="panel" id="summary" hidden></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let scenario = null, source = null;

const CODE_CLASS = {
  slot_already_filled: "p-mute", preview_only: "p-live", live: "p-live",
};
function pillClass(code, type) {
  if (type === "slot_filled") return "p-ok";
  if (type === "contact_suppressed") return "p-mute";
  if (type === "contact_would_call") return "p-live";
  if (type === "call_completed") return code === "yes" ? "p-ok" : "p-skip";
  if (type === "call_failed") return "p-stop";
  return "p-skip";
}

async function init() {
  scenario = await (await fetch("/api/scenario")).json();
  const s = scenario.slot;
  $("slot").innerHTML =
    `<div><b>${s.businessName}</b><br><span>${s.service}</span></div>` +
    `<div><b>${s.startsAtLocal}</b><br><span>${s.timeZone}</span></div>` +
    `<div><b>&pound;${s.valueGbp}</b><br><span>value if filled</span></div>` +
    `<div class="mono" style="color:var(--muted)">${s.id}</div>`;
  const simulated = scenario.liveConfigured && scenario.transport === "fake";
  $("live").textContent = simulated ? "Run (simulated)" : "Run live";
  $("modeNote").innerHTML = !scenario.liveConfigured
    ? "Preview only: this server has no CALL-E credentials, so it cannot place a call."
    : simulated
      ? `<b>Simulated mode.</b> The full run loop, including acceptance and suppression, against a `
        + `fake transport. <b>No real calls are placed.</b> Type the slot id `
        + `<span class="mono">${s.id}</span> above to unlock the run.`
      : `<b style="color:var(--stop)">LIVE mode: this will place real phone calls.</b> Type the `
        + `slot id <span class="mono">${s.id}</span> above to unlock it.`;
  $("confirm").disabled = !scenario.liveConfigured;
  refreshLiveButton();
  resetRows();
}

function resetRows() {
  $("rows").innerHTML = scenario.waitlist.map((c, i) => `
    <tr class="pending" id="row_${c.id}">
      <td class="mono">${i + 1}</td>
      <td>${c.name}</td>
      <td class="mono">${maskLocal(c.phone)}</td>
      <td class="mono">${c.timeZone ?? '<span style="color:var(--stop)">not recorded</span>'}</td>
      <td class="decision"><span class="pill p-mute">waiting</span></td>
    </tr>`).join("");
}

// The server never sends raw numbers; this masks the ones loaded from the scenario for display.
function maskLocal(p) { return p.slice(0, 2) + "*".repeat(Math.max(0, p.length - 4)) + p.slice(-2); }

function setDecision(contactId, label, cls, reason) {
  const row = $("row_" + contactId);
  if (!row) return;
  row.classList.remove("pending");
  row.querySelector(".decision").innerHTML =
    `<span class="pill ${cls}">${label}</span>` + (reason ? `<div class="reason">${reason}</div>` : "");
}

function logLine(text, cls) {
  const log = $("log");
  if (log.firstChild && log.firstChild.classList?.contains("note")) log.innerHTML = "";
  const d = document.createElement("div");
  d.innerHTML = text;
  if (cls) d.className = cls;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function onEvent(e) {
  switch (e.type) {
    case "run_started": {
      const label = e.mode !== "live" ? "PREVIEW" : e.transport === "live" ? "LIVE" : "SIMULATED";
      logLine(`<b>Run started</b> &mdash; ${label}. ${e.detail}`, "banner");
      break;
    }
    case "contact_skipped":
      setDecision(e.contactId, "not called", "p-skip", `<span class="mono">${e.code}</span> &mdash; ${e.detail}`);
      logLine(`Skipped <b>${e.name}</b> (${e.phone}): ${e.detail}`);
      break;
    case "contact_would_call":
      setDecision(e.contactId, "would call", "p-live", e.detail);
      logLine(`Would call <b>${e.name}</b> (${e.phone}) &mdash; passed every guardrail.`);
      break;
    case "call_started":
      setDecision(e.contactId, "calling&hellip;", "p-live", `idempotency key <span class="mono">${e.idempotencyKey}</span>`);
      logLine(`Calling <b>${e.name}</b> (${e.phone})&hellip;`);
      break;
    case "call_completed":
      setDecision(e.contactId, e.answer ?? e.status, pillClass(e.answer, e.type), e.summary ?? "");
      logLine(`<b>${e.name}</b> answered: <b>${e.answer ?? e.status}</b>`);
      break;
    case "call_failed":
      setDecision(e.contactId, "failed", "p-stop", e.detail);
      logLine(`Call to <b>${e.name}</b> failed: ${e.detail}`);
      break;
    case "slot_filled":
      setDecision(e.contactId, "SLOT FILLED", "p-ok", e.detail);
      logLine(`<b>Slot filled by ${e.name}.</b> No further calls will be placed.`, "banner");
      break;
    case "contact_suppressed":
      setDecision(e.contactId, "never called", "p-mute", e.detail);
      logLine(`Suppressed <b>${e.name}</b> &mdash; slot already filled.`);
      break;
    case "run_cancelled":
      logLine(`<b>Cancelled.</b> ${e.detail}`, "banner");
      break;
    case "run_error":
      logLine(`<b style="color:var(--stop)">Error:</b> ${e.detail}`, "banner");
      break;
    case "run_finished":
      showSummary(e.summary);
      // Close from this side. An EventSource reopens itself when the server ends the stream,
      // which would silently start the whole backfill again.
      finish();
      break;
  }
}

function showSummary(s) {
  $("summary").hidden = false;
  $("summary").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${s.filled ? "Filled" : "Open"}</b><span>${s.filledBy ? s.filledBy.name : "no acceptance"}</span></div>
      <div class="stat"><b>${s.callsPlaced}</b><span>calls placed</span></div>
      <div class="stat"><b>${s.callsAvoided}</b><span>calls avoided</span></div>
      <div class="stat"><b>${s.skipped}</b><span>blocked by a guardrail</span></div>
      <div class="stat"><b>${s.suppressed}</b><span>suppressed after the fill</span></div>
    </div>`;
}

function start(mode) {
  if (source) source.close();
  resetRows();
  $("log").innerHTML = "";
  $("summary").hidden = true;

  let qs = `mode=${mode}`;
  if (mode === "live") {
    const typed = $("confirm").value.trim();
    if (typed !== scenario.slot.id) {
      logLine("<b>Live run not confirmed.</b> The slot id did not match, so nothing was called.", "banner");
      return;
    }
    qs += `&confirmSlotId=${encodeURIComponent(typed)}`;
  }

  $("preview").disabled = $("live").disabled = true;
  $("cancel").disabled = false;
  source = new EventSource(`/api/run?${qs}`);
  source.onmessage = (m) => onEvent(JSON.parse(m.data));
  source.onerror = finish;
}

function finish() {
  if (source) { source.close(); source = null; }
  $("preview").disabled = false;
  $("cancel").disabled = true;
  refreshLiveButton();
}

// The live button only wakes up once the operator has typed the exact slot id. Intent has to be
// specific to the thing being authorised, not a general "yes".
function refreshLiveButton() {
  $("live").disabled = !scenario?.liveConfigured || $("confirm").value.trim() !== scenario.slot.id;
}
$("confirm").oninput = refreshLiveButton;
$("preview").onclick = () => start("preview");
$("live").onclick = () => start("live");
$("cancel").onclick = async () => {
  await fetch("/api/cancel", { method: "POST" });
  $("cancel").disabled = true;
};
init();
</script>
</body>
</html>
