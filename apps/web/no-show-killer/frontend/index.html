<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No-Show Killer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <div>
        <h1>No-Show Killer</h1>
        <p class="subtitle">CALL-E confirms tomorrow's appointments so they don't ghost you.</p>
      </div>
      <div class="header-actions">
        <button id="run-batch" class="btn-primary">Run tomorrow's confirmation calls</button>
        <span id="api-status" class="api-status">checking backend…</span>
      </div>
    </div>
  </header>

  <main>
    <section class="add-appointment">
      <h2>Add appointment</h2>
      <form id="add-form">
        <input type="text" id="patientName" placeholder="Patient name" required />
        <input type="tel" id="phone" placeholder="+1 555 123 4567" required />
        <input type="text" id="service" placeholder="Service" required />
        <input type="datetime-local" id="scheduledAt" required />
        <button type="submit" class="btn-primary">Add appointment</button>
      </form>
    </section>

    <div id="appointments"></div>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-header">
        <div>
          <h2 class="patient-name"></h2>
          <p class="service"></p>
          <p class="time"></p>
        </div>
        <span class="badge"></span>
      </div>
      <div class="activity"></div>
      <div class="result hidden">
        <h3>Summary</h3>
        <p class="summary"></p>
        <details class="transcript-wrap">
          <summary>Transcript</summary>
          <pre class="transcript"></pre>
        </details>
      </div>
      <button class="confirm-btn">Send confirmation call</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
