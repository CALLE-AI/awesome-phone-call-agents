[project]
name = "callproof-call-analyzer"
version = "0.1.0"
description = "Asynchronous transcript verification service for CallProof"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "redis>=5.2,<7",
  "rq>=2.1,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
