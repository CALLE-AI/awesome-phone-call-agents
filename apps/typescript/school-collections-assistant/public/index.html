<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kumbusha AI</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <header>
      <div>
        <h1>Kumbusha <span>AI</span></h1>
        <p>Intelligent school payment reminders</p>
      </div>

      <div class="status">
        <span></span>
        Ready
      </div>
    </header>


    <main>

      <section class="card">

        <div class="card-header">
          <h2>Payment Reminder</h2>
          <p>Let Kumbusha handle the conversation.</p>
        </div>


        <form id="reminderForm">

          <div class="grid">

            <div class="field">
              <label>Parent / Guardian</label>
              <input
                id="parentName"
                type="text"
                placeholder="e.g. John Banda"
                required
              />
            </div>

            <div class="field">
              <label>Student</label>
              <input
                id="studentName"
                type="text"
                placeholder="e.g. Mary Banda"
                required
              />
            </div>

            <div class="field">
              <label>Phone number</label>
              <input
                id="phoneNumber"
                type="tel"
                placeholder="+12025550100"
                required
              />
            </div>

            <div class="field">
              <label>Outstanding amount</label>
              <input
                id="amount"
                type="text"
                placeholder="K 2,500"
                required
              />
            </div>

            <div class="field">
              <label>Payment due date</label>
              <input
                id="dueDate"
                type="date"
                required
              />
            </div>

            <div class="field">
              <label>School</label>
              <input
                id="schoolName"
                type="text"
                placeholder="e.g. ABC Private School"
              />
            </div>

          </div>


          <button type="submit" id="callButton">
            <span></span>
            Start Reminder Call
          </button>

        </form>

      </section>


      <section class="card result-card">

        <div class="card-header">
          <h2>Call Result</h2>
          <p id="callStatus">No call started yet.</p>
        </div>

        <div id="result">
          <div class="empty">
            <div></div>
            <p>Call results will appear here.</p>
          </div>
        </div>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
