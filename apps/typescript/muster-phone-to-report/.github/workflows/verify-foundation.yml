name: Verify foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Verify exact toolchain
        run: corepack pnpm verify:toolchain
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install the pinned browser prerequisite
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run the repository foundation gate
        run: corepack pnpm verify:foundation
