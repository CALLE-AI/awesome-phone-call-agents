<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeCalle — Senior Voice Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col justify-between p-3 sm:p-6">

  <!-- Header -->
  <header class="bg-indigo-900 text-white rounded-2xl p-4 sm:p-5 shadow-md flex items-center justify-between gap-2">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">BridgeCalle</h1>
      <p class="text-xs sm:text-sm text-indigo-200 font-medium">1-Tap Voice Companion for Seniors</p>
    </div>
    
    <!-- Top Action Area: Self-Calling Number Badge + Summary & Plus Buttons -->
    <div class="flex items-center space-x-2">
      <!-- Compact Self Calling Phone Number Input -->
      <div class="flex items-center bg-indigo-800/90 border border-indigo-700 rounded-2xl px-2.5 py-1 text-xs space-x-1">
        <span class="text-indigo-200 font-bold hidden sm:inline">📞 Call:</span>
        <input type="tel" id="self-phone-input" value="+919265408610" placeholder="+919265408610" class="bg-transparent text-white font-extrabold text-xs w-28 sm:w-32 focus:outline-none" oninput="saveSelfPhone()">
      </div>

      <!-- Summary Icon -->
      <button onclick="openSummaryModal()" title="View Recent Summaries & WhatsApp Export" class="w-11 h-11 bg-indigo-800 hover:bg-indigo-700 text-white rounded-2xl transition shadow flex items-center justify-center text-xl font-bold active:scale-95 border border-indigo-700">
        📋
      </button>

      <!-- Plus Button -->
      <button onclick="openAddModal()" title="Add Family Member" class="w-11 h-11 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl transition shadow-lg flex items-center justify-center text-2xl font-extrabold active:scale-95">
        +
      </button>
    </div>
  </header>

  <!-- Main Interface -->
  <main class="max-w-4xl mx-auto w-full my-4 space-y-5">

    <!-- Active Call Banner -->
    <div id="active-banner" class="hidden bg-slate-900 text-white rounded-2xl p-5 shadow-lg space-y-2 text-center">
      <div class="flex items-center justify-center space-x-2 text-emerald-400 font-bold text-base sm:text-lg">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Calling Phone Now via CALL-E!</span>
      </div>
      <p class="text-xs sm:text-sm text-slate-300">Your phone should ring shortly at <strong id="calling-target" class="text-white">+919265408610</strong>.</p>
    </div>

    <!-- Cards Dynamic Grid Container -->
    <div id="cards-container" class="grid gap-4 sm:gap-6">
      <!-- Dynamic Family Cards Rendered Here -->
    </div>

  </main>

  <!-- Add / Edit Person Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900">Add Person</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg px-2">✕</button>
      </div>

      <input type="hidden" id="modal-person-id">

      <!-- Photo Upload -->
      <div class="flex items-center space-x-4">
        <div class="relative w-20 h-20 rounded-2xl overflow-hidden bg-slate-100 border-2 border-indigo-200 flex-shrink-0 flex items-center justify-center">
          <img id="modal-photo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" class="w-full h-full object-cover">
        </div>
        <div class="space-y-2">
          <button onclick="document.getElementById('modal-photo-input').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition">
            📷 Select Photo
          </button>
          <input type="file" id="modal-photo-input" accept="image/*" class="hidden" onchange="handleModalPhoto(event)">
        </div>
      </div>

      <!-- Name (Default: Human) -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Name</label>
        <input type="text" id="modal-name-input" placeholder="e.g. Human" class="w-full bg-slate-50 border-2 border-slate-200 text-slate-900 text-base font-bold rounded-xl p-3 focus:border-indigo-600 focus:outline-none">
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-between pt-2">
        <button id="modal-delete-btn" onclick="deleteModalPerson()" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-xl transition hidden">Delete</button>
        <div class="flex items-center space-x-2 ml-auto">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">Cancel</button>
          <button onclick="saveModalPerson()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition shadow">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Call Summaries Modal -->
  <div id="summary-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3 flex-shrink-0">
        <div class="flex items-center space-x-2">
          <span class="text-xl">📋</span>
          <h3 class="text-lg font-bold text-slate-900">Call Logs & WhatsApp Export</h3>
        </div>
        <button onclick="closeSummaryModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg px-2">✕</button>
      </div>

      <!-- Summaries List Container -->
      <div id="summaries-list" class="space-y-4 overflow-y-auto pr-1 flex-1">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-xs text-slate-500 py-3">
    BridgeCalle Voice AI — Active Listening Companion for Seniors.
  </footer>

  <script>
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

    const DEFAULT_CALL_LOGS = [
      {
        id: 'call_calle_1oMoqkWuXCJuiPN_PV0QoQ',
        callNumber: 4,
        startTime: '13 Sept 2026, 8:14 PM',
        duration: '0s (Ended)',
        status: 'DISPATCHED',
        points: [
          'Call #4 dispatched via CALL-E.',
          'Target Phone: +919265408610',
          'Greeting: Water & meal check-in.',
          'Outcome: Call dispatched and ended after connection.'
        ]
      },
      {
        id: 'call_calle_SB-65hvhJt88oEvOV6cNyQ',
        callNumber: 3,
        startTime: '13 Sept 2026, 8:01 PM',
        duration: '0s',
        status: 'NOT CONNECTED',
        points: [
          'Not connected / Not answered'
        ]
      },
      {
        id: 'call_calle_7f7cd0decdaa4b83bf04b2fa995e0e9f',
        callNumber: 2,
        startTime: '13 Sept 2026, 6:38 PM',
        duration: '17s',
        status: 'COMPLETED',
        points: [
          'Call connected successfully. AI greeted Human gently asking about water intake & food status.',
          'User responded briefly and ended call after 17 seconds.'
        ]
      },
      {
        id: 'call_calle_e5fcaf01293d443ba93bbc86ed216530',
        callNumber: 1,
        startTime: '10 Sept 2026, 8:25 PM',
        duration: '27s',
        status: 'COMPLETED',
        points: [
          'Active listening call connected. AI asked if Human can hear clearly.',
          'Human acknowledged with "Yes". AI held active listening presence before call ended.'
        ]
      }
    ];

    let selfPhone = '+919265408610';
    let persons = [
      {
        id: 'p_1',
        name: 'Human',
        waPhone: '+919265408610',
        photo: DEFAULT_AVATAR,
        callLogs: DEFAULT_CALL_LOGS
      }
    ];

    function sanitizeLogPoints(points) {
      if (!points || !Array.isArray(points)) return ['Not connected / Not answered'];
      return points.map(p => {
        if (!p) return 'Not connected / Not answered';
        const lower = p.toLowerCase();
        if (lower.includes('did not connect') || lower.includes('did not complete') || lower.includes('failed') || lower.includes('cancelled') || lower.includes('busy') || lower.includes('unavailable') || lower.includes('no answer') || lower.includes('retry')) {
          return 'Not connected / Not answered';
        }
        return p;
      });
    }

    function loadData() {
      const savedSelfPhone = localStorage.getItem('bc_self_phone');
      if (savedSelfPhone) {
        selfPhone = savedSelfPhone;
        document.getElementById('self-phone-input').value = selfPhone;
      }

      const savedPersons = localStorage.getItem('bc_persons_v4');
      if (savedPersons) {
        try { 
          const parsed = JSON.parse(savedPersons);
          if (Array.isArray(parsed) && parsed.length > 0) {
            parsed.forEach(p => {
              if (!p.name || p.name === 'Ramesh Patel') p.name = 'Human';
              if (p.callLogs && Array.isArray(p.callLogs)) {
                p.callLogs.forEach(log => {
                  log.points = sanitizeLogPoints(log.points);
                });
              }
            });
            persons = parsed;
          }
        } catch(e) {}
      } else {
        saveData();
      }

      renderCards();
    }

    function saveSelfPhone() {
      selfPhone = document.getElementById('self-phone-input').value.trim() || '+919265408610';
      localStorage.setItem('bc_self_phone', selfPhone);
    }

    function saveData() {
      localStorage.setItem('bc_persons_v4', JSON.stringify(persons));
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const count = persons.length;
      if (count === 1) {
        container.className = 'grid grid-cols-1 gap-4';
      } else if (count <= 3) {
        container.className = 'grid grid-cols-1 gap-4';
      } else {
        container.className = 'grid grid-cols-2 gap-4 sm:gap-6';
      }

      persons.forEach((person) => {
        const card = document.createElement('div');
        card.className = 'relative bg-white rounded-3xl p-6 sm:p-8 shadow-md border-2 border-slate-200 hover:border-indigo-500 transition flex flex-col items-center text-center space-y-4 group';

        card.innerHTML = `
          <!-- Pencil Icon Strictly For Editing -->
          <button type="button" onclick="openEditModal('${person.id}')" title="Edit Person" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-700 flex items-center justify-center text-base transition shadow-sm z-20 cursor-pointer">
            ✏️
          </button>

          <!-- Clickable Calling Area: Big Photo & Small Name -->
          <div onclick="triggerCallForPerson('${person.id}')" class="w-full flex flex-col items-center cursor-pointer space-y-4 active:scale-95 transform transition duration-150">
            <!-- Big Photo -->
            <div class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-3xl overflow-hidden bg-slate-100 border-4 border-indigo-100 flex-shrink-0 flex items-center justify-center shadow-md group-hover:border-indigo-400 transition">
              <img src="${person.photo || DEFAULT_AVATAR}" class="w-full h-full object-cover">
            </div>

            <!-- Small Name below pic (Click Name to View Summary) -->
            <h2 onclick="event.stopPropagation(); openPersonSummary('${person.id}')" title="Click name to view summary" class="text-xl sm:text-2xl font-extrabold text-slate-900 leading-tight hover:text-indigo-600 underline decoration-indigo-300 underline-offset-4 cursor-pointer z-10">${person.name || 'Human'}</h2>

            <!-- Tap instruction badge -->
            <span class="inline-block bg-emerald-50 text-emerald-700 text-xs sm:text-sm font-bold px-4 py-1.5 rounded-full border border-emerald-200">
              📞 Tap Photo or Name To Call
            </span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function triggerCallForPerson(personId) {
      const person = persons.find(p => p.id === personId) || persons[0];
      
      const userPhone = document.getElementById('self-phone-input').value.trim() || selfPhone || '+919265408610';
      
      if (!userPhone) {
        alert('Please enter your phone number in the header!');
        return;
      }

      const banner = document.getElementById('active-banner');
      document.getElementById('calling-target').innerText = userPhone;
      banner.classList.remove('hidden');

      const startTimeStr = new Date().toLocaleString([], { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const callNum = (person.callLogs ? person.callLogs.length : 0) + 1;

      // Construct Initial Log Entry
      const newCallLog = {
        id: `call_${Date.now()}`,
        callNumber: callNum,
        startTime: startTimeStr,
        duration: 'Connecting...',
        status: 'DISPATCHED',
        calleTaskId: null,
        points: [
          `Call #${callNum} dispatched via CALL-E at ${startTimeStr}.`,
          `Target Phone: ${userPhone}`,
          `Greeting: Water & meal check-in.`,
          `AI Persona: Quiet active listener (95% listening ratio).`
        ]
      };

      if (!person.callLogs) person.callLogs = [];
      person.callLogs.unshift(newCallLog);
      saveData();

      try {
        const response = await fetch('/api/calls/trigger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            seniorName: person.name || 'Human',
            seniorPhone: userPhone,
            customTopic: 'daily_reflection'
          })
        }).catch(() => null);

        let taskId = null;

        if (!response || !response.ok) {
          const apiKey = 'iams_live_2yEKIUCh7wwkEhur6hrg_efff7ad44485789d72a989db013b801d1c86aa11ec5ba600584d9b28a9e82602';
          const cleanPhone = userPhone.replace(/[^+\d]/g, '');
          const isIndia = cleanPhone.startsWith('+91');

          const directRes = await fetch('https://api.heycall-e.com/v1/calls', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `bridgecalle_${Date.now()}`
            },
            body: JSON.stringify({
              task: `Call ${cleanPhone} in ${isIndia ? 'English (India)' : 'English'}. Ask gently if they drank water and ate food today. Then listen quietly with short nods like Mmhmm.`,
              recipients: [{ phones: [cleanPhone], region: isIndia ? 'IN' : 'US', locale: isIndia ? 'en-IN' : 'en-US' }]
            })
          });

          const directData = await directRes.json();
          if (directRes.ok && directData.id) {
            taskId = directData.id;
            newCallLog.calleTaskId = taskId;
            newCallLog.points[3] = `CALL-E Task ID: ${taskId}`;
            saveData();
          } else {
            newCallLog.status = 'NOT CONNECTED';
            newCallLog.duration = '0s';
            newCallLog.points = ['Not connected / Not answered'];
            saveData();
          }
        } else {
          const data = await response.json();
          if (data.call && data.call.calleCallId) {
            taskId = data.call.calleCallId;
            newCallLog.calleTaskId = taskId;
            newCallLog.points[3] = `CALL-E Task ID: ${taskId}`;
            saveData();
          } else {
            newCallLog.status = 'NOT CONNECTED';
            newCallLog.duration = '0s';
            newCallLog.points = ['Not connected / Not answered'];
            saveData();
          }
        }

        setTimeout(() => {
          banner.classList.add('hidden');
          if (taskId) {
            alert(`✅ CALL-E Initiated Call #${callNum} to your phone (${userPhone})! Your phone will ring shortly.`);
            pollCallCompletion(person.id, newCallLog.id, taskId);
          } else {
            alert(`⚠️ Call status: Not connected.`);
          }
        }, 1500);

      } catch (err) {
        newCallLog.status = 'NOT CONNECTED';
        newCallLog.duration = '0s';
        newCallLog.points = ['Not connected / Not answered'];
        saveData();
        banner.classList.add('hidden');
        alert('Not connected: ' + err.message);
      }
    }

    async function pollCallCompletion(personId, logId, taskId) {
      const apiKey = 'iams_live_2yEKIUCh7wwkEhur6hrg_efff7ad44485789d72a989db013b801d1c86aa11ec5ba600584d9b28a9e82602';
      const person = persons.find(p => p.id === personId);
      if (!person || !person.callLogs) return;

      const log = person.callLogs.find(l => l.id === logId);
      if (!log) return;

      [15000, 30000, 60000, 90000, 120000].forEach(delay => {
        setTimeout(async () => {
          try {
            const res = await fetch(`https://api.heycall-e.com/v1/calls/${taskId}`, {
              headers: { 'Authorization': `Bearer ${apiKey}` }
            });
            const data = await res.json();
            if (res.ok && data) {
              const summaryText = data.summary || (data.recipients && data.recipients[0] ? data.recipients[0].summary : null);
              const statusStr = (data.status || '').toLowerCase();

              if (statusStr === 'failed' || statusStr === 'cancelled' || data.failure_code) {
                log.status = 'NOT CONNECTED';
                log.duration = '0s';
                log.points = ['Not connected / Not answered'];
                saveData();
                return;
              }

              if (summaryText) {
                const lower = summaryText.toLowerCase();
                if (lower.includes('did not connect') || lower.includes('did not complete') || lower.includes('failed') || lower.includes('busy') || lower.includes('unavailable') || lower.includes('no answer') || lower.includes('retry')) {
                  log.status = 'NOT CONNECTED';
                  log.duration = '0s';
                  log.points = ['Not connected / Not answered'];
                } else {
                  log.status = 'COMPLETED';
                  log.duration = 'Completed';
                  log.points = [
                    `CALL-E Task ID: ${data.id}`,
                    `Summary: ${summaryText}`
                  ];
                }
                saveData();
              }
            }
          } catch(e) {}
        }, delay);
      });
    }

    // Modal Handlers
    function openAddModal() {
      document.getElementById('modal-title').innerText = 'Add Person';
      document.getElementById('modal-person-id').value = '';
      document.getElementById('modal-name-input').value = 'Human';
      document.getElementById('modal-photo-preview').src = DEFAULT_AVATAR;
      document.getElementById('modal-delete-btn').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function openEditModal(personId) {
      const person = persons.find(p => p.id === personId);
      if (!person) return;

      document.getElementById('modal-title').innerText = 'Edit Person Details';
      document.getElementById('modal-person-id').value = person.id;
      document.getElementById('modal-name-input').value = person.name || 'Human';
      document.getElementById('modal-photo-preview').src = person.photo || DEFAULT_AVATAR;
      document.getElementById('modal-delete-btn').classList.remove('hidden');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function handleModalPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('modal-photo-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveModalPerson() {
      const id = document.getElementById('modal-person-id').value;
      const name = document.getElementById('modal-name-input').value.trim() || 'Human';
      const photo = document.getElementById('modal-photo-preview').src;

      if (id) {
        const index = persons.findIndex(p => p.id === id);
        if (index >= 0) {
          persons[index] = { 
            ...persons[index],
            name, 
            photo 
          };
        }
      } else {
        persons.push({
          id: `p_${Date.now()}`,
          name,
          waPhone: selfPhone || '+919265408610',
          photo,
          callLogs: []
        });
      }

      saveData();
      closeModal();
    }

    function deleteModalPerson() {
      const id = document.getElementById('modal-person-id').value;
      if (!id) return;

      if (confirm('Are you sure you want to remove this person?')) {
        persons = persons.filter(p => p.id !== id);
        saveData();
        closeModal();
      }
    }

    // Summary Modal Functions
    function openSummaryModal() {
      renderSummariesList();
      document.getElementById('summary-modal').classList.remove('hidden');
    }

    function openPersonSummary(personId) {
      renderSummariesList(personId);
      document.getElementById('summary-modal').classList.remove('hidden');
    }

    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.add('hidden');
    }

    function updatePersonWhatsAppNumber(personId, newWaNumber) {
      const person = persons.find(p => p.id === personId);
      if (person) {
        person.waPhone = newWaNumber.trim();
        saveData();
      }
    }

    function shareCallLogToWhatsApp(personId, logId) {
      const person = persons.find(p => p.id === personId);
      if (!person) return;

      const log = (person.callLogs || []).find(l => l.id === logId);
      if (!log) return;

      const inputEl = document.getElementById(`wa-input-${person.id}`);
      const waNum = inputEl ? inputEl.value.trim() : (person.waPhone || selfPhone || '+919265408610');

      person.waPhone = waNum;
      saveData();

      const summaryContent = `Call #${log.callNumber}\nStart Time: ${log.startTime}\nDuration: ${log.duration}\nStatus: ${log.status}\n\nKey Points:\n` + 
        (log.points || []).map(p => `• ${p}`).join('\n');

      const waMessage = encodeURIComponent(`💌 BridgeCalle Call Summary for ${person.name || 'Human'}:\n\n${summaryContent}\n\nSent via BridgeCalle Voice AI.`);
      const cleanWaNum = waNum.replace(/[^+\d]/g, '').replace('+', '');
      const waUrl = `https://wa.me/${cleanWaNum}?text=${waMessage}`;

      window.open(waUrl, '_blank');
    }

    function renderSummariesList(filterPersonId = null) {
      const listEl = document.getElementById('summaries-list');
      listEl.innerHTML = '';

      const targetPersons = filterPersonId 
        ? persons.filter(p => p.id === filterPersonId)
        : persons;

      if (targetPersons.length === 0) {
        listEl.innerHTML = '<div class="text-sm text-slate-500 text-center py-6">No records available.</div>';
        return;
      }

      targetPersons.forEach(person => {
        const personBox = document.createElement('div');
        personBox.className = 'bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-3';

        const logs = person.callLogs || [];
        const currentWaNum = person.waPhone || selfPhone || '+919265408610';

        if (logs.length === 0) {
          personBox.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <div class="flex items-center space-x-2">
                <img src="${person.photo || DEFAULT_AVATAR}" class="w-8 h-8 rounded-full object-cover border">
                <span class="font-extrabold text-slate-900 text-base">${person.name || 'Human'}</span>
              </div>
              <span class="text-xs text-slate-400 font-bold">0 Calls</span>
            </div>
            <div class="text-sm font-bold text-slate-500 py-3 italic text-center bg-white rounded-xl border border-slate-200">
              🚫 Not connected / Not answered
            </div>
          `;
        } else {
          let logsHtml = '';
          logs.forEach(log => {
            const isNotConn = log.status && (log.status.includes('NOT') || log.status.includes('FAILED'));
            const badgeClass = isNotConn ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800';
            const statusLabel = isNotConn ? 'NOT CONNECTED' : (log.status || 'COMPLETED');

            const pointsList = (log.points && log.points.length > 0)
              ? log.points.map(pt => `<li class="flex items-start gap-1.5"><span class="text-indigo-600 font-bold">•</span> <span>${pt}</span></li>`).join('')
              : `<li>Not connected / Not answered</li>`;

            logsHtml += `
              <div class="bg-white p-3.5 rounded-xl border border-slate-200 space-y-2 text-xs sm:text-sm">
                <div class="flex items-center justify-between border-b border-slate-100 pb-1.5 font-bold">
                  <div class="flex items-center space-x-2">
                    <span class="text-indigo-900">📞 Call #${log.callNumber}</span>
                    <span class="text-[10px] px-2 py-0.5 rounded font-extrabold uppercase ${badgeClass}">
                      ${statusLabel}
                    </span>
                  </div>
                  <span class="text-slate-500 text-xs">⏱️ ${log.startTime} | ⌛ ${log.duration}</span>
                </div>
                <div class="font-bold text-slate-800 text-xs uppercase tracking-wider">Summary Points:</div>
                <ul class="space-y-1 text-slate-700 font-medium leading-relaxed">
                  ${pointsList}
                </ul>
              </div>
            `;
          });

          personBox.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <div class="flex items-center space-x-2">
                <img src="${person.photo || DEFAULT_AVATAR}" class="w-8 h-8 rounded-full object-cover border">
                <span class="font-extrabold text-slate-900 text-base">${person.name || 'Human'}</span>
              </div>
              <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-lg">${logs.length} Call(s) Logged</span>
            </div>

            <div class="space-y-3">
              ${logsHtml}
            </div>

            <!-- Single Configurable WhatsApp Destination Input for This Person in Summary Modal -->
            <div class="bg-emerald-50/80 rounded-xl p-3 border border-emerald-200 space-y-2 mt-2">
              <label class="block text-[11px] font-bold text-emerald-800 uppercase tracking-wider">Target WhatsApp Number for Summaries:</label>
              <div class="flex items-center space-x-2">
                <input type="tel" id="wa-input-${person.id}" value="${currentWaNum}" placeholder="+919265408610" class="flex-1 bg-white border border-emerald-300 text-slate-900 text-xs font-bold rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="updatePersonWhatsAppNumber('${person.id}', this.value)">
                
                <button onclick="shareCallLogToWhatsApp('${person.id}', '${logs[0] ? logs[0].id : ''}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-lg transition shadow-sm flex items-center gap-1.5 flex-shrink-0">
                  <span>💬 Share Latest</span>
                </button>
              </div>
            </div>
          `;
        }

        listEl.appendChild(personBox);
      });
    }

    // Initialize
    loadData();
  </script>
</body>
</html>
