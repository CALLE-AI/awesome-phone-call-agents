[project]
name = "quotewake-salesforce"
version = "0.1.0"
description = "One-shot Salesforce quote follow-up calls for QuoteWake."
requires-python = ">=3.11"
dependencies = [
  "Babel>=2.14",
  "calle-ai>=0.6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
