[project]
name = "quotewake-salesforce"
version = "0.1.0"
description = "Salesforce quote selection and CALL-E planning-only dry-run for QuoteWake."
requires-python = ">=3.11"
dependencies = [
  "Babel>=2.14",
  "calle-ai>=0.6.0",
  "python-dotenv>=1.0.1",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
