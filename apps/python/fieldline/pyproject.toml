[project]
name = "fieldline"
version = "0.1.0"
description = "Demo-first lone-worker check-ins with authorized live calling and human review of generated safety decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Huanyi Xie" }]
dependencies = [
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live mode: real phone calls through the CALL-E platform.
live = ["calle-ai==0.7.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
fieldline = "fieldline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
