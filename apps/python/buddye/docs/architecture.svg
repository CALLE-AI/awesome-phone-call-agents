<text x="296" y="494" font-size="11.5" fill="#5d5f66">BuddyE may call them</text>
<text x="296" y="510" font-size="11.5" fill="#5d5f66">never implies help is coming</text>

<rect x="528" y="450" width="204" height="90" rx="8" fill="#ffffff" stroke="#d9d9d4"/>
<text x="540" y="474" font-size="13" font-weight="600" fill="#17181c">② Block captain</text>
<text x="540" y="494" font-size="11.5" fill="#5d5f66">BuddyE notifies the</text>
<text x="540" y="510" font-size="11.5" fill="#5d5f66">volunteer running the sweep</text>

<rect x="772" y="450" width="204" height="90" rx="8" fill="#ffffff" stroke="#d9d9d4"/>
<text x="784" y="474" font-size="13" font-weight="600" fill="#17181c">③ Responder handoff</text>
<text x="784" y="494" font-size="11.5" fill="#5d5f66">packet prepared, not sent</text>
<text x="784" y="510" font-size="11.5" fill="#5d5f66">address · need · last words</text>
<text x="784" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">released_at = null</text>

