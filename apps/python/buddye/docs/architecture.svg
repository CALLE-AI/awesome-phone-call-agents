<text x="52" y="510" font-size="11.5" fill="#5d5f66">skipped rungs recorded</text>
<text x="52" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">orchestrator/escalate.py</text>

<rect x="284" y="450" width="204" height="90" rx="8" fill="#ffffff" stroke="#d9d9d4"/>
