<text x="1028" y="494" font-size="11.5" fill="#8c1d18">"system", "bot" refused</text>
<text x="1028" y="510" font-size="11.5" fill="#8c1d18">only then is anyone told</text>
<text x="1028" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#a8554f">escalate.release()</text>

