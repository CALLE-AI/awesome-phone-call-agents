<text x="540" y="328" font-size="11.5" fill="#5d5f66">UNREACHABLE outranks URGENT</text>
<text x="540" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">orchestrator/decide.py</text>

<rect x="772" y="268" width="204" height="96" rx="8" fill="#f1eefa" stroke="#8b7cc8"/>
