<!-- header -->
<text x="40" y="44" font-size="22" font-weight="700" fill="#17181c">BuddyE architecture</text>
<text x="40" y="68" font-size="13" fill="#5d5f66">Rules decide. Models only rank or write. Nothing reaches an emergency service without a named human.</text>

<!-- ============ 1 · SWEEP ============ -->
<text x="40" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.5" fill="#8a8b91">1 · SWEEP — EVERY NEIGHBOUR, WORST FIRST, TO THE END OF THE LIST</text>

