<text x="834" y="884" text-anchor="middle" font-size="9.5" fill="#8a8b91">live</text>

<text x="40" y="960" font-size="11.5" fill="#5d5f66">Default is no-call: CALL_PROVIDER=mock, empty dial allowlist, hard call budget. Emergency services contacted by software: 0.</text>
