<text x="540" y="624" font-size="13" font-weight="600" fill="#3f3470">Dispatch agent</text>
<text x="540" y="644" font-size="11.5" fill="#5b4f86">ranks legal candidates only</text>
<text x="540" y="660" font-size="11.5" fill="#5b4f86">writes a one-sentence why</text>
<text x="540" y="682" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a80ad">agents/dispatch_agent.py</text>

<rect x="772" y="600" width="204" height="96" rx="8" fill="#ffffff" stroke="#d9d9d4"/>
<text x="784" y="624" font-size="13" font-weight="600" fill="#17181c">validate_choice()</text>
<text x="784" y="644" font-size="11.5" fill="#5d5f66">re-checked against live rows</text>
<text x="784" y="660" font-size="11.5" fill="#5d5f66">fallback: deterministic pick</text>
<text x="784" y="682" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">orchestrator/dispatch.py</text>

