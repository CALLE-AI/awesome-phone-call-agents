<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 980" role="img" aria-labelledby="bda-title bda-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="bda-title">BuddyE architecture</title>
<desc id="bda-desc">A hazard and a roster are triaged worst-first, each neighbour's call contract is compiled and passed through consent, allowlist and budget gates to CALL-E. Results are validated locally, unknown fields go to an LLM understanding pass, and decide() returns one of five outcomes; no answer, failed and unreadable calls flow into decide() rather than being skipped. Anything not SAFE opens an escalation ladder that ends at a prepared handoff packet only a named human can release, and an incident whose dispatch is filtered by code, ranked by a model, re-validated by code, committed automatically for community resources and held as PROPOSED for EMS, fire and police until a named human authorises it. A FastAPI and SQLite backend streams events over SSE to a React console.</desc>
