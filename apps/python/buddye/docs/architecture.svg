<text x="508" y="640" text-anchor="middle" font-size="9.5" fill="#8a8b91">legal</text>
<text x="752" y="640" text-anchor="middle" font-size="9.5" fill="#8a8b91">pick</text>

<rect x="1016" y="572" width="204" height="60" rx="8" fill="#dff0e5" stroke="#2f8a5b" stroke-width="1.5"/>
<text x="1028" y="596" font-size="13" font-weight="700" fill="#1f5a3b">Community → COMMITTED</text>
<text x="1028" y="616" font-size="11.5" fill="#1f5a3b">water · ride · power · nurse</text>

<rect x="1016" y="648" width="204" height="68" rx="8" fill="#fff7dc" stroke="#9a6a12" stroke-width="1.5"/>
<text x="1028" y="672" font-size="13" font-weight="700" fill="#6f4c0c">Agency → PROPOSED</text>
<text x="1028" y="692" font-size="11.5" fill="#6f4c0c">EMS · fire · police welfare</text>
<text x="1028" y="708" font-size="11.5" fill="#6f4c0c">routed, timed, nobody asked</text>

<path d="M976,636 L1014,604" fill="none" stroke="#2f8a5b" stroke-width="1.6" marker-end="url(#bda-arrow)"/>
<path d="M976,660 L1014,680" fill="none" stroke="#9a6a12" stroke-width="1.6" marker-end="url(#bda-arrow)"/>

<rect x="1016" y="744" width="204" height="60" rx="8" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
<text x="1028" y="768" font-size="13" font-weight="700" fill="#8c1d18">Named human authorises</text>
<text x="1028" y="788" font-size="11.5" fill="#8c1d18">or declines, with a reason</text>
<line x1="1118" y1="716" x2="1118" y2="742" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#bda-arrow-red)"/>

<text x="40" y="740" font-size="11.5" fill="#5d5f66">A model outage degrades the prose, never the dispatch: every agent call falls back to the deterministic answer</text>
<text x="40" y="758" font-size="11.5" fill="#5d5f66">and is logged as an OperatorAction. Documentation and correspondence agents draft ICS-214 / ICS-213 / sitreps</text>
<text x="40" y="776" font-size="11.5" fill="#5d5f66">and family messages the same way: drafted, never signed or sent by software.</text>

<!-- ============ 3 · PLATFORM ============ -->
<text x="40" y="840" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.5" fill="#8a8b91">3 · PLATFORM</text>

<rect x="40" y="852" width="360" height="80" rx="8" fill="#16181d"/>
<text x="56" y="878" font-size="13" font-weight="700" fill="#ffffff">FastAPI · SQLModel · SQLite</text>
<text x="56" y="898" font-size="11.5" fill="#c9ccd4">all state in the DB · restart re-attaches</text>
<text x="56" y="916" font-size="11.5" fill="#c9ccd4">loops: movement sim · incident sync · status</text>

<rect x="450" y="852" width="360" height="80" rx="8" fill="#16181d"/>
<text x="466" y="878" font-size="13" font-weight="700" fill="#ffffff">Event bus → Server-Sent Events</text>
<text x="466" y="898" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c9ccd4">/api/stream/hazards/{id}</text>
<text x="466" y="916" font-size="11.5" fill="#c9ccd4">replays from since_event_id</text>

<rect x="860" y="852" width="360" height="80" rx="8" fill="#16181d"/>
<text x="876" y="878" font-size="13" font-weight="700" fill="#ffffff">React console · Tailwind · Leaflet</text>
<text x="876" y="898" font-size="11.5" fill="#c9ccd4">sweep board · case page · incidents</text>
<text x="876" y="916" font-size="11.5" fill="#c9ccd4">approvals queue · live fleet map (OSM)</text>

<line x1="400" y1="892" x2="448" y2="892" stroke="#8a8b91" stroke-width="1.4" marker-end="url(#bda-arrow-light)"/>
<text x="424" y="884" text-anchor="middle" font-size="9.5" fill="#8a8b91">events</text>
