<text x="52" y="644" font-size="11.5" fill="#5d5f66">address + needs + reasons</text>
<text x="52" y="660" font-size="11.5" fill="#5d5f66">priority 1 (life safety) – 5</text>
<text x="52" y="682" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">orchestrator/incidents.py</text>

<rect x="284" y="600" width="204" height="96" rx="8" fill="#ffffff" stroke="#d9d9d4"/>
<text x="296" y="624" font-size="13" font-weight="600" fill="#17181c">Eligibility filter</text>
<text x="296" y="644" font-size="11.5" fill="#5d5f66">free · capable · in range</text>
<text x="296" y="660" font-size="11.5" fill="#5d5f66">agency only if justified</text>
<text x="296" y="682" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a8b91">domain/fleet.py · geo.py</text>

