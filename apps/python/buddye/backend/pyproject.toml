[project]
name = "buddye-backend"
version = "0.1.0"
description = "BuddyE: hazard-triaged neighbour welfare sweeps over CALL-E calls, with an escalation ladder and human-authorised dispatch."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sse-starlette>=2.1",
  "jsonschema>=4.22",
  "httpx>=0.27,<1.0",
  "calle-ai>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]
llm = ["anthropic>=0.40", "openai>=1.40"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
