[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "known-number"
version = "0.1.0"
description = "Callback verification for vendor payment-detail changes over CALL-E: dial the number on file, never the number in the request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["calle-ai>=0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
known-number = "known_number.cli:main"

[tool.setuptools.packages.find]
include = ["known_number*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
