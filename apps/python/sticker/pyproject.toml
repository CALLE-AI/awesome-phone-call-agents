[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sticker"
version = "0.1.0"
description = "Ask pharmacies what a prescription actually costs in cash, and price the answer against the national average acquisition cost CMS publishes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
sticker = "sticker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sticker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
