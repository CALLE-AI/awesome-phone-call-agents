[project]
name = "rehab-adherence-caller"
version = "0.1.0"
description = "Decide which rehab patients need a call from their attendance trajectory, then place one logistics call each through CALL-E."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["calle-ai==0.7.0"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rehab_adherence"]
