[project]
name = "agentcover-callgate"
version = "0.1.0"
description = "Bounded-autonomy gateway that wraps every CALL-E phone call in the safety_protocol enforcement layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "calle-ai>=0.7.0",
    "httpx>=0.27",
]

[project.scripts]
agentcover-callgate = "agentcover_callgate.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentcover_callgate*"]
