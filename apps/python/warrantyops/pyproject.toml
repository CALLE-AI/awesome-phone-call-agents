[project]
name = "warrantyops"
version = "0.1.0"
description = "Turn a warranty exception into a verified recovery outcome over one authorized CALL-E phone call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
live = ["calle-ai>=0.7.0"]
dev = ["pytest>=8.0"]

[project.scripts]
warrantyops = "warrantyops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warrantyops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
