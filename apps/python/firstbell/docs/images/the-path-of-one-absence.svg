<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1008" role="img" aria-labelledby="absence-path-title absence-path-desc" font-family="'neue-haas-grotesk-text', 'ui-fallback', Arial, Helvetica, sans-serif">
<title id="absence-path-title">The path of one unexplained school absence through firstbell</title>
<desc id="absence-path-desc">A row from a school's nightly absence export meets a gate on consent and then on voice reachability: a family with no recorded consent is never dialled and no call is owed, and a family the telephone cannot reach is not dialled either but goes to a person to be reached another way. A row that passes both gets a short spoken instruction in the family's own language, with the disclosure that the caller is automated spoken first: the reason for the absence, the expected return, and a check that the person answering knew the student was absent, and nothing else. CALL-E then places the call under a cap on families rather than on requests, one idempotency key for each row, polled until the call reaches a terminal status. The answer comes back as exactly one of three endings. Resolved: a schema-valid answer came back, and nobody looks again. Undetermined: the call happened and no usable answer came back, so a person owns it. Failed: nobody was reached on any number, so a person owns it too. A safeguarding escalation is a second axis that can attach to resolved or to undetermined, because only an explicit yes closes a record; it sends the case to the top of a person's queue. A failed call carries no answer to read, so it cannot escalate.</desc>
<defs>
<marker id="ar" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4.5, 0 9" fill="#6B6864"/></marker>
<marker id="ar-mark" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4.5, 0 9" fill="#795616"/></marker>
</defs>
