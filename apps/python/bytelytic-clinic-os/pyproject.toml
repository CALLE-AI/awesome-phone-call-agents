[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytelytic-clinic-os"
version = "1.0.0"
description = "Autonomous healthcare clinic operating system for patient appointment confirmations, no-show recovery, recalls, and prior auth payor IVR calls via CALL-E."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "calle-ai>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.scripts]
bytelytic-clinic-os = "bytelytic_clinic.cli:main"
