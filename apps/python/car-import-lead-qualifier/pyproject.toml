[project]
name = "calle-car-import-lead-qualifier-app"
version = "0.1.0"
description = "Consent-first car import lead qualification calls with the CALL-E Python SDK."
requires-python = ">=3.11"
dependencies = [
  "calle-ai==0.2.0",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.scripts]
car-import-lead-qualifier = "qualifier.runner:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qualifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
