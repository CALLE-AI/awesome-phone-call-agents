[project]
name = "sourcy"
version = "1.0.0"
description = "Autonomous AI procurement agent that calls suppliers through CALL-E and recommends the best supplier"
requires-python = ">=3.11"
dependencies = [
    "calle-ai>=0.6.0",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
