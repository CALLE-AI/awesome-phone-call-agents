[project]
name = "webhook-result-receiver"
version = "0.1.0"
description = "Durable CALL-E webhook receiver reference app"
requires-python = ">=3.11"
dependencies = [
  "calle-ai==0.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
