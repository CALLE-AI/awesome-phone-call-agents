<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RelayMe — your call, as text</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2b;
    --ink: #f4f5fb;         /* ~15:1 on --bg */
    --muted: #b9bed6;        /* ~7:1 on --bg  */
    --you: #2f6df6;          /* user bubble */
    --you-ink: #ffffff;
    --agent: #253052;        /* our AI on the call */
    --them: #2a2f45;         /* the other party */
    --relayme: #1e2740;      /* app narration */
    --ok: #38c172;
    --warn: #f6c344;
    --stop: #ff6b6b;
    --line: #2b3150;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); line-height: 1.5;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .phone {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 28px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  header {
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, #2f6df6, #7c4dff);
    display: grid; place-items: center; font-weight: 800; font-size: 18px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .scenarios {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02);
  }
  .scenarios button {
    font: inherit; font-size: 12.5px; color: var(--ink);
    background: #202744; border: 1px solid var(--line);
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  .scenarios button[aria-pressed="true"] {
    background: var(--you); border-color: var(--you); color: var(--you-ink); font-weight: 600;
  }
  .thread {
    padding: 18px 16px; display: flex; flex-direction: column; gap: 12px;
    min-height: 420px; max-height: 62vh; overflow-y: auto;
  }
  .row { display: flex; flex-direction: column; max-width: 84%; }
  .row.you { align-self: flex-end; align-items: flex-end; }
  .row.agent, .row.them, .row.relayme { align-self: flex-start; }
  .who { font-size: 11px; color: var(--muted); margin: 0 6px 3px; letter-spacing: .02em; }
  .bubble {
    padding: 10px 13px; border-radius: var(--radius); font-size: 14.5px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .you .bubble { background: var(--you); color: var(--you-ink); border-bottom-right-radius: 5px; }
  .agent .bubble { background: var(--agent); border-bottom-left-radius: 5px; }
  .them .bubble { background: var(--them); border-bottom-left-radius: 5px; }
  .relayme .bubble {
    background: var(--relayme); color: var(--muted); font-size: 13.5px;
    border: 1px dashed var(--line);
  }
  .outcome {
    margin: 4px 16px 18px; padding: 12px 14px; border-radius: 12px;
    font-size: 13.5px; display: flex; align-items: center; gap: 10px;
  }
  .outcome .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .outcome.answered { background: rgba(56,193,114,.12); border: 1px solid var(--ok); }
  .outcome.answered .dot { background: var(--ok); }
  .outcome.partial, .outcome.refused, .outcome.voicemail, .outcome.no_answer,
  .outcome.wrong_number, .outcome.needs_human {
    background: rgba(246,195,68,.10); border: 1px solid var(--warn);
  }
  .outcome.partial .dot, .outcome.refused .dot, .outcome.voicemail .dot,
  .outcome.no_answer .dot, .outcome.wrong_number .dot, .outcome.needs_human .dot { background: var(--warn); }
  footer { padding: 12px 16px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  .load { margin-top: 8px; }
  .load label { color: var(--muted); }
</style>
</head>
<body>
  <main class="phone" aria-label="RelayMe conversation">
    <header>
      <div class="logo" aria-hidden="true">R</div>
      <div>
        <h1>RelayMe</h1>
        <p>Your phone call, as a text thread</p>
      </div>
    </header>

    <div class="scenarios" role="group" aria-label="Demo scenarios">
      <button data-scn="answered" aria-pressed="true">Answered</button>
      <button data-scn="hedged" aria-pressed="false">Unsure</button>
      <button data-scn="refused" aria-pressed="false">Refused</button>
      <button data-scn="voicemail" aria-pressed="false">Voicemail</button>
      <button data-scn="wrong_number" aria-pressed="false">Wrong number</button>
    </div>

    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation, newest at the bottom"></div>
    <div id="outcome"></div>

    <footer>
      No one hears you and you never sit through the call. RelayMe speaks, listens,
      and shows you every word here. It reports what was said, never a guess.
      <div class="load">
        <label for="file">Load a result JSON: </label>
        <input id="file" type="file" accept="application/json" aria-label="Load a RelayMe result JSON file" />
      </div>
    </footer>
  </main>

<script>
// Embedded demo threads so the page opens with zero setup. The Python client
// emits this exact shape via --emit-thread-json for real (or mock) calls.
const SCENARIOS = {
  answered: {
    outcome: "answered",
    outcome_text: "Answer: the prescription is ready for pickup, any time before 8 PM today.",
    messages: [
      {role:"you", text:"Is my prescription at Maple Street Pharmacy ready for pickup?"},
      {role:"relayme", text:"I'll call Maple Street Pharmacy, say I'm an AI assistant calling for you, and ask that. You'll see everything said here."},
      {role:"relayme", text:"Calling Maple Street Pharmacy\u2026"},
      {role:"agent", text:"Hi, I'm an AI assistant calling for someone who can't use the phone. Is the prescription for Jordan Rivera ready for pickup?"},
      {role:"them", text:"Let me check\u2026 yes, it's ready at the pickup counter."},
      {role:"agent", text:"Roughly what time today can they collect it?"},
      {role:"them", text:"Any time before we close at 8 PM."},
      {role:"relayme", text:"Here's your answer:"},
      {role:"relayme", text:"Yes. It's ready at the pickup counter, any time before 8 PM today."}
    ]
  },
  hedged: {
    outcome: "partial",
    outcome_text: "I got part of an answer, but no confirmed yes. A person may need to follow up.",
    messages: [
      {role:"you", text:"Is my prescription at Maple Street Pharmacy ready?"},
      {role:"relayme", text:"I'll call and ask, and show you everything said here."},
      {role:"relayme", text:"Calling Maple Street Pharmacy\u2026"},
      {role:"agent", text:"Is the prescription for Jordan Rivera ready for pickup?"},
      {role:"them", text:"Um, I think so? The pharmacist stepped out, I can't be sure right now."},
      {role:"agent", text:"Understood. I won't record that as confirmed."},
      {role:"relayme", text:"I got part of an answer, but not all of it:"},
      {role:"relayme", text:"Staff were unsure and couldn't confirm. I did not record a yes."}
    ]
  },
  refused: {
    outcome: "refused",
    outcome_text: "They wouldn't answer that over the phone. A person may need to follow up.",
    messages: [
      {role:"you", text:"Is my prescription ready?"},
      {role:"relayme", text:"Calling Maple Street Pharmacy\u2026"},
      {role:"agent", text:"Is the prescription for Jordan Rivera ready for pickup?"},
      {role:"them", text:"We can't share prescription information with an automated system. The patient needs to come in with ID."},
      {role:"agent", text:"Understood. Thank you, I'll pass that along."},
      {role:"relayme", text:"They wouldn't answer that over the phone. A person may need to follow up."}
    ]
  },
  voicemail: {
    outcome: "voicemail",
    outcome_text: "It went to voicemail. No one answered live and I left no private details.",
    messages: [
      {role:"you", text:"Is my prescription ready?"},
      {role:"relayme", text:"Calling Maple Street Pharmacy\u2026"},
      {role:"them", text:"You've reached Maple Street Pharmacy. We're closed. Leave a message after the tone."},
      {role:"agent", text:"Thank you, I'll try again during opening hours."},
      {role:"relayme", text:"It went to voicemail, so no one answered live. I didn't leave any private details."}
    ]
  },
  wrong_number: {
    outcome: "wrong_number",
    outcome_text: "That reached the wrong place, so I stopped. Please check the number.",
    messages: [
      {role:"you", text:"Is my prescription ready at Maple Street Pharmacy?"},
      {role:"relayme", text:"Calling the number you gave\u2026"},
      {role:"agent", text:"Hi, is this Maple Street Pharmacy?"},
      {role:"them", text:"No, this is a private residence. Wrong number."},
      {role:"agent", text:"Sorry to bother you. I'll stop here."},
      {role:"relayme", text:"That number reached the wrong place, so I stopped. Please check the number."}
    ]
  }
};

const WHO = { you:"You", relayme:"RelayMe", agent:"Agent on the call", them:"They said" };

function render(data) {
  const thread = document.getElementById("thread");
  thread.innerHTML = "";
  (data.messages || []).forEach(m => {
    const row = document.createElement("div");
    row.className = "row " + m.role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = WHO[m.role] || m.role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.text;
    if (m.role !== "you") row.appendChild(who);
    row.appendChild(bubble);
    thread.appendChild(row);
  });
  const out = document.getElementById("outcome");
  const oc = data.outcome || "needs_human";
  out.innerHTML = "";
  const box = document.createElement("div");
  box.className = "outcome " + oc;
  box.setAttribute("role", "status");
  const dot = document.createElement("span");
  dot.className = "dot"; dot.setAttribute("aria-hidden", "true");
  const txt = document.createElement("span");
  txt.textContent = data.outcome_text || oc;
  box.appendChild(dot); box.appendChild(txt);
  out.appendChild(box);
  thread.scrollTop = thread.scrollHeight;
}

function selectScenario(name, btn) {
  document.querySelectorAll(".scenarios button").forEach(b =>
    b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  render(SCENARIOS[name]);
}

document.querySelectorAll(".scenarios button").forEach(btn => {
  btn.addEventListener("click", () => selectScenario(btn.dataset.scn, btn));
});

document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { render(JSON.parse(reader.result)); }
    catch { alert("That file is not valid RelayMe thread JSON."); }
  };
  reader.readAsText(f);
});

render(SCENARIOS.answered);
</script>
</body>
</html>
