[project]
name = "positive-contact"
version = "0.1.0"
description = "PSPS Medical Baseline live-contact confirmation on CALL-E. Voicemail does not count."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "truststore>=0.10",
]

[project.optional-dependencies]
sdk = ["calle-ai>=0.6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pc = "positive_contact.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["positive_contact*"]
