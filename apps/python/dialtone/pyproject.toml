[project]
name = "dialtone"
version = "0.1.0"
description = "DIALTONE: detection + handshake + attestation protocol for when the other end of a CALL-E call is also an AI."
requires-python = ">=3.11"
dependencies = [
  "calle-ai",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dialtone = "dialtone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
