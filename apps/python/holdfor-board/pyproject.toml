[project]
name = "holdfor-board"
version = "0.1.0"
description = "Post-visit follow-up board for HoldFor: Check-in Review Items, human Release, Rebooking Call"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    # The Release form posts form-encoded, and Starlette cannot parse a form without
    # this. Not optional: without it the board renders and every Release fails.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
holdfor = "holdfor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holdfor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
