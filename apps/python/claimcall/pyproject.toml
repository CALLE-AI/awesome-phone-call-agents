[project]
name = "claimcall"
version = "0.1.0"
description = "Human-approved airline disruption resolution: turn a cancelled-flight case into a bounded CALL-E phone task and convert the call into structured case state, commitments, evidence, and the traveller's next action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
claimcall = "claimcall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimcall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
