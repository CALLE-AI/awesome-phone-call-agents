<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="ccwf-title ccwf-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="ccwf-title">ClaimCall workflow: disruption case to before-after outcome</title>
<desc id="ccwf-desc">Six-step flow. A disruption case yields missing information, a bounded call plan, one human approval, a CALL-E phone call, and a structured outcome showing before versus after.</desc>
<defs>
<marker id="ccwf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L8,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
</marker>
<marker id="ccwf-arrow-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L8,4 L0,8" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="600" fill="#f5f5f5"/>
<text x="120" y="36" font-family="ui-monospace, monospace" font-size="8" letter-spacing="2" fill="#7a8399">CLAIMCALL WORKFLOW</text>
<text x="120" y="60" font-family="Georgia, serif" font-size="22" fill="#2d3142">What changed because of the call?</text>

<rect x="120" y="84" width="400" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
<text x="320" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Disruption case</text>
<text x="320" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">cancelled flight + known facts</text>

<line x1="320" y1="136" x2="320" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#ccwf-arrow)"/>

<rect x="120" y="156" width="400" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Missing information</text>
<text x="320" y="194" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">5 unknown facts, deterministic, no LLM</text>

<line x1="320" y1="208" x2="320" y2="228" stroke="#4f5d75" stroke-width="1" marker-end="url(#ccwf-arrow)"/>

<rect x="120" y="228" width="400" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Bounded call plan</text>
<text x="320" y="266" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">5 objectives + 6 restrictions</text>

<line x1="320" y1="280" x2="320" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#ccwf-arrow)"/>

<rect x="120" y="300" width="400" height="52" rx="6" fill="#eb6c36" fill-opacity="0.05" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="320" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Human approval</text>
<text x="320" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">Approve and Call, exactly one call</text>

<line x1="320" y1="352" x2="320" y2="372" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ccwf-arrow-link)"/>

<rect x="120" y="372" width="400" height="52" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="320" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">CALL-E phone call</text>
<text x="320" y="410" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">POST /v1/calls, poll to terminal</text>

<line x1="320" y1="424" x2="320" y2="444" stroke="#4f5d75" stroke-width="1" marker-end="url(#ccwf-arrow)"/>

<rect x="120" y="444" width="400" height="52" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
<text x="320" y="466" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Structured outcome</text>
<text x="320" y="482" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4f5d75">BEFORE vs AFTER, commitments, next action</text>

<text x="320" y="532" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#4f5d75">Unknown or malformed results fail closed to human review.</text>
</svg>
