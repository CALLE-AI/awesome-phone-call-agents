[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicscout"
version = "1.0.0"
description = "CivicScout: Proactive Public Works Voice Agent with CALL-E, FastMCP, Google Cloud Run, and Firestore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "google-cloud-firestore>=2.16.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
