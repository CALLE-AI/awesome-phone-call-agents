<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Bank Dispatch</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --muted: #666666;
    --faint: #a1a1a1;
    --border: #eaeaea;
    --border-hover: #cccccc;
    --primary: #171717;
    --primary-hover: #383838;
    --accent: #0070f3;
    --success: #29a383;
    --warning: #f5a623;
    --danger: #e00000;
    --purple: #7928ca;
    --orange: #e56b1f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    margin: 0 auto; max-width: 62rem; padding: 0 1.5rem 4rem;
    font-size: 15px; line-height: 1.6;
  }
  nav {
    display: flex; align-items: center; gap: 1.25rem;
    padding: 1.1rem 0; margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  nav .brand { font-weight: 600; letter-spacing: -0.01em; margin-right: auto; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--fg); }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin: 1.2rem 0 0.3rem; }
  h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; margin: 2rem 0 0.3rem; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .error { color: var(--danger); font-weight: 500; font-size: 14px; }

  input, select, button { font: inherit; font-size: 14px; }
  input:not([type]), input[type="text"], input[type="number"], select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    color: var(--fg);
  }
  input:hover, select:hover { border-color: var(--border-hover); }
  input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
  }
  button {
    cursor: pointer;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.9rem;
    color: var(--fg);
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #fafafa; border-color: var(--border-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    background: var(--primary); border-color: var(--primary);
    color: #fff; font-weight: 500;
  }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0; }
  .table-wrap table { margin: 0; min-width: 42rem; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th {
    text-align: left; font-size: 12px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint);
    padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border);
  }
  td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #fafafa; }
  td input:not([type="checkbox"]) { width: 100%; min-width: 5rem; }

  fieldset {
    border: 1px solid var(--border); border-radius: var(--radius);
    margin: 1rem 0; padding: 0.8rem 1rem;
  }
  legend {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); padding: 0 0.4rem;
  }
  label { display: block; margin: 0.4rem 0; }
  .add-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 1rem 0; }
  .add-form input { flex: 1 1 150px; width: auto; }
  .add-form button { flex: 0 0 auto; }

  @media (max-width: 640px) {
    body { padding: 0 1rem 3rem; font-size: 14.5px; }
    h1 { font-size: 1.3rem; }
    nav { gap: 0.9rem; padding: 0.9rem 0; font-size: 13.5px; }
    .cards { grid-template-columns: 1fr; }
    .card { padding: 0.8rem 0.9rem; }
    input:not([type="checkbox"]), select { width: 100%; }
    form > button.primary { width: 100%; }
    fieldset { padding: 0.7rem 0.8rem; }
  }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(17rem, 100%), 1fr)); gap: 0.75rem; margin: 1.2rem 0; }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.9rem 1rem; background: var(--bg);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover { border-color: var(--border-hover); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
  .card strong { font-weight: 600; }
  .card ul { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 13.5px; }
  .card li { margin: 0.15rem 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.45rem;
    margin: 0.45rem 0; padding: 0.1rem 0.65rem;
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 12px; font-weight: 500; color: var(--fg);
    background: #fafafa;
  }
  .badge::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint); flex: none;
  }
  .badge.queued::before { background: var(--faint); }
  .badge.dialing::before { background: var(--warning); animation: pulse 1.2s ease-in-out infinite; }
  .badge.completed::before { background: var(--success); }
  .badge.no_answer::before { background: var(--orange); }
  .badge.callback_requested::before { background: var(--purple); }
  .badge.failed::before { background: var(--danger); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .shortlist { margin-top: 2rem; }
</style>
</head>
<body>
<nav>
  <span class="brand">Blood Bank Dispatch</span>
  <a href="/request">New request</a>
  <a href="/runs">History</a>
  <a href="/banks">Registry</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
