{% extends "base.html" %}
{% block content %}
<h1>Bank registry</h1>
<p class="muted">Numbers are dialled exactly as stored, so they must be E.164 (e.g. +15550101234).</p>
<form class="add-form" method="post" action="/banks">
  <input name="name" placeholder="Name" required>
  <input name="phone" placeholder="+15550101234" required>
  <input name="area" placeholder="Area">
  <input name="notes" placeholder="Notes, e.g. ask for the lab" size="34">
  <button class="primary">Add bank</button>
</form>
<div class="table-wrap">
<table>
  <tr><th>Name</th><th>Phone</th><th>Area</th><th>Notes</th><th>Active</th><th></th></tr>
  {% for b in banks %}
  <tr>
    <td><input form="edit-{{ b.id }}" name="name" value="{{ b.name }}" size="14"></td>
    <td><input form="edit-{{ b.id }}" name="phone" value="{{ b.phone }}" size="15"></td>
    <td><input form="edit-{{ b.id }}" name="area" value="{{ b.area or '' }}" size="10"></td>
    <td><input form="edit-{{ b.id }}" name="notes" value="{{ b.notes or '' }}" size="26"></td>
    <td><input form="edit-{{ b.id }}" type="checkbox" name="active" {% if b.active %}checked{% endif %}></td>
    <td>
      <form id="edit-{{ b.id }}" method="post" action="/banks/{{ b.id }}"><button>Save</button></form>
      <form method="post" action="/banks/{{ b.id }}/toggle"><button>{{ 'Deactivate' if b.active else 'Activate' }}</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
</div>
{% endblock %}
