[project]
name = "casechaser"
version = "0.1.0"
description = "Chase an open claim, refund, repair, or delivery case to closure by phone with CALL-E, with a commitment ledger, escalation ladder, and human-owned money decisions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
casechaser = "casechaser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casechaser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
