[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-buyer-followup"
version = "0.1.0"
description = "Context-aware, broker-reviewed CALL-E buyer follow-up demo"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "openai>=1.70,<4", "streamlit>=1.40,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["calle-ai==1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real_estate_buyer_followup = ["data/*.json", "knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
