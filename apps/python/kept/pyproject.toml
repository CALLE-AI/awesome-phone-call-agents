[project]
name = "kept"
version = "0.1.0"
description = "Capture payment promises on CALL-E calls, then verify them against the cash that arrives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "calle-ai>=0.7.0",
  "httpx>=0.27.0,<1.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kept = "kept.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kept"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
